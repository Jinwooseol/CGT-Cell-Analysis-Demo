[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cgt-cell-analysis-demo"
version = "1.0.0"
description = "Desktop + headless pipeline for microscopy-based cell analysis (optical well indexing, AI cell counting, PCR indexing, result merging)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jinwoo Seol" }]
keywords = [
    "computer-vision",
    "microscopy",
    "cell-counting",
    "deep-learning",
    "pyside6",
    "image-processing",
    "cell-and-gene-therapy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Core runtime dependencies (headless pipeline + GUI both need these).
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pydantic>=2.5",
    "PySide6>=6.6",
]

[project.optional-dependencies]
# Model inference / training stack. Split out so the headless CSV/geometry
# tooling can be installed without the heavy DL footprint.
ai = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=0.9",
]
# Extra augmentations used only by the optional training workflow.
train = [
    "albumentations>=1.3",
]
# Desktop packaging.
build = [
    "pyinstaller>=6.0",
]
# Developer tooling: linting, testing, coverage.
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.5",
]

[project.urls]
Homepage = "https://github.com/Jinwooseol/CGT-Cell-Analysis-Demo"
Repository = "https://github.com/Jinwooseol/CGT-Cell-Analysis-Demo"
Issues = "https://github.com/Jinwooseol/CGT-Cell-Analysis-Demo/issues"

[project.scripts]
# Headless pipeline runner (no display required).
cgt-cli = "cgt_cell_analysis_demo.cli:main"

[project.gui-scripts]
# Desktop application entry point.
cgt-demo = "cgt_cell_analysis_demo.app:main"

[tool.setuptools.packages.find]
include = ["cgt_cell_analysis_demo*"]

[tool.setuptools.package-data]
cgt_cell_analysis_demo = ["resources/*"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", "models", "reference_data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
# UI code leans on broad excepts for best-effort platform shims; keep signal.
ignore = [
    "E501",  # line length handled by formatter, not enforced hard
    "B008",  # function calls in argument defaults (Qt/pydantic patterns)
    "B905",  # zip(strict=) — equal-length numeric loops in the geometry code
]

[tool.ruff.lint.per-file-ignores]
"cgt_cell_analysis_demo/ui/**" = ["E402"]  # lazy imports after Qt attribute setup
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["cgt_cell_analysis_demo"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["cgt_cell_analysis_demo"]
omit = ["cgt_cell_analysis_demo/ui/*", "cgt_cell_analysis_demo/app.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
