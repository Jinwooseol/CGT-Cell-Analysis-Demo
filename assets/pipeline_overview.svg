<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
<rect width="1200" height="380" fill="#f8fafc"/>
<text x="60" y="50" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">CGT Cell Analysis Demo Pipeline</text>
<g font-family="Arial" fill="#0f172a">
  <rect x="50" y="100" rx="20" ry="20" width="220" height="120" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
  <text x="160" y="145" text-anchor="middle" font-size="24" font-weight="700">Step 1</text>
  <text x="160" y="178" text-anchor="middle" font-size="20">Optical Well Indexing</text>
  <text x="160" y="205" text-anchor="middle" font-size="16">Locate wells from microscopy tiles</text>

  <rect x="340" y="100" rx="20" ry="20" width="220" height="120" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="450" y="145" text-anchor="middle" font-size="24" font-weight="700">Step 2</text>
  <text x="450" y="178" text-anchor="middle" font-size="20">Cell Counting</text>
  <text x="450" y="205" text-anchor="middle" font-size="16">Run AI inference per well image</text>

  <rect x="630" y="100" rx="20" ry="20" width="220" height="120" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="740" y="145" text-anchor="middle" font-size="24" font-weight="700">Step 3</text>
  <text x="740" y="178" text-anchor="middle" font-size="20">PCR Well Indexing</text>
  <text x="740" y="205" text-anchor="middle" font-size="16">Map PCR-side image positions</text>

  <rect x="920" y="100" rx="20" ry="20" width="220" height="120" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="1030" y="145" text-anchor="middle" font-size="24" font-weight="700">Step 4</text>
  <text x="1030" y="178" text-anchor="middle" font-size="20">Merge Results</text>
  <text x="1030" y="205" text-anchor="middle" font-size="16">Join counts and indexing outputs</text>

  <line x1="270" y1="160" x2="340" y2="160" stroke="#64748b" stroke-width="4"/>
  <polygon points="340,160 326,152 326,168" fill="#64748b"/>
  <line x1="560" y1="160" x2="630" y2="160" stroke="#64748b" stroke-width="4"/>
  <polygon points="630,160 616,152 616,168" fill="#64748b"/>
  <line x1="850" y1="160" x2="920" y2="160" stroke="#64748b" stroke-width="4"/>
  <polygon points="920,160 906,152 906,168" fill="#64748b"/>

  <rect x="340" y="270" rx="18" ry="18" width="510" height="70" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="595" y="314" text-anchor="middle" font-size="22" font-weight="700">Optional Training Mode: prepare labels → train regressor → export weights</text>
</g>
</svg>